<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - McMorrow Olympics Fall '26</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
  <div id="nav-mount"></div>
  <main class="main">
    <div class="container">

      <!-- Login -->
      <div id="loginView">
        <div class="login-panel">
          <div class="login-card">
            <div style="font-size:48px;margin-bottom:16px;">👤</div>
            <h2>Athlete Login</h2>
            <p>Enter your first name to view your profile</p>
            <div class="login-error" id="loginError"></div>
            <div class="form-group">
              <label class="form-label">First Name</label>
              <input type="text" class="form-input" id="loginFirst" placeholder="e.g. Krish" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label">Last Name (optional)</label>
              <input type="text" class="form-input" id="loginLast" placeholder="Your last name">
            </div>
            <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="handleLogin()">View My Profile</button>
          </div>
        </div>
      </div>

      <!-- Profile -->
      <div id="profileView" style="display:none;">
        <div id="loading" class="text-center" style="padding:60px 0;"><p style="color:var(--text-dim);">Loading your stats...</p></div>
        <div id="profileContent" style="display:none;">
          <div class="profile-header">
            <div class="profile-avatar" id="avatar"></div>
            <h1 id="name"></h1>
            <div class="profile-rank" id="rank"></div>
            <div id="teamLine" style="margin-top:8px;"></div>
          </div>

          <div id="activeAlert" style="display:none;" class="mb-40">
            <div class="card" style="border-color:rgba(52,211,153,0.4);background:rgba(52,211,153,0.05);padding:24px;text-align:center;">
              <div class="live-indicator" style="justify-content:center;margin-bottom:8px;"><span class="live-dot"></span> Event In Progress</div>
              <div id="activeAlertContent"></div>
            </div>
          </div>

          <div class="profile-stats" id="stats"></div>

          <section class="mb-40">
            <div class="section-title">My Results</div>
            <div class="section-subtitle">Performance across all events (team scores shown for team events)</div>
            <div id="eventBreakdown"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-mount"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.renderNav('athlete');
    App.renderFooter();

    async function handleLogin() {
      const first = document.getElementById('loginFirst').value.trim();
      const last = document.getElementById('loginLast').value.trim();
      if (!first) { showError('Please enter your first name.'); return; }
      try {
        await API.athleteLogin(first, last);
        showProfile();
        App.renderNav('athlete');
      } catch (e) {
        const names = API.getAthletes().map(a => a.first_name).join(', ');
        showError(`"${first}" not found.${names ? ' Athletes: ' + names : ' No athletes registered yet — ask the commissioner to add you.'}`);
      }
    }

    function showError(msg) {
      const el = document.getElementById('loginError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !API.getCurrentAthleteId()) handleLogin();
    });

    function showProfile() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('profileView').style.display = '';
    }

    function renderProfile() {
      const athleteId = API.getCurrentAthleteId();
      if (!athleteId) return;
      const athlete = API.getAthleteById(athleteId);
      if (!athlete) return;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('profileContent').style.display = '';

      const standings = API.getStandings();
      const myStanding = standings.find(s => s.id === athleteId);
      const events = API.getEvents();
      const team = API.getTeamForAthlete(athleteId);

      document.getElementById('avatar').textContent = athlete.first_name[0];
      document.getElementById('name').textContent = athlete.first_name + (athlete.last_name ? ' ' + athlete.last_name : '');
      const rank = myStanding ? myStanding.rank : '—';
      document.getElementById('rank').textContent = `${App.getMedalEmoji(rank)} Overall Rank: #${rank} of ${standings.length}`;
      document.getElementById('teamLine').innerHTML = team ? `<span class="team-badge">🤝 ${team.name}</span>` : '<span style="font-size:12px;color:var(--text-dim);">Not on a team yet</span>';

      let golds = 0, silvers = 0, bronzes = 0, totalPts = 0, played = 0;
      events.forEach(e => {
        const es = myStanding?.event_scores[e.id];
        const p = es?.placement;
        if (p === 1) golds++;
        if (p === 2) silvers++;
        if (p === 3) bronzes++;
        if (p) { totalPts += es.points; played++; }
      });

      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><div class="stat-value">${totalPts}</div><div class="stat-label">Total Points</div></div>
        <div class="stat-card"><div class="stat-value">${played}/${events.length}</div><div class="stat-label">Events Scored</div></div>
        <div class="stat-card">
          <div class="stat-value">
            <span style="color:var(--gold-bright);">${golds}</span>
            <span style="color:var(--silver);margin:0 4px;">${silvers}</span>
            <span style="color:var(--bronze);">${bronzes}</span>
          </div>
          <div class="stat-label" style="display:flex;gap:12px;justify-content:center;"><span>🥇</span><span>🥈</span><span>🥉</span></div>
        </div>`;

      const activeEvent = events.find(e => e.status === 'active');
      if (activeEvent) {
        document.getElementById('activeAlert').style.display = '';
        const es = myStanding?.event_scores[activeEvent.id];
        const relevant = activeEvent.event_type === 'team' ? !!team : true;
        document.getElementById('activeAlertContent').innerHTML = `
          <div style="font-size:32px;margin-bottom:4px;">${activeEvent.icon}</div>
          <h3 style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--white);">${activeEvent.name}</h3>
          ${!relevant ? "<p style=\"font-size:13px;color:var(--text-dim);margin-top:8px;\">This is a team event and you're not on a team yet.</p>" :
            es && es.placement
            ? `<p style="font-size:16px;color:var(--green);font-weight:600;margin-top:8px;">You're in ${es.placement}${['','st','nd','rd'][es.placement]||'th'} place (${es.points} pts)</p>`
            : '<p style="font-size:14px;color:var(--text-dim);margin-top:8px;">Awaiting your score...</p>'}
          <a href="leaderboard.html" class="btn btn-sm btn-outline" style="margin-top:12px;">Watch Live Leaderboard →</a>`;
      } else {
        document.getElementById('activeAlert').style.display = 'none';
      }

      document.getElementById('eventBreakdown').innerHTML = events.map(e => {
        const es = myStanding?.event_scores[e.id];
        const isTeamEvent = e.event_type === 'team';
        const relevant = isTeamEvent ? !!team : true;

        let resultHTML;
        if (!relevant) {
          resultHTML = `<div style="color:var(--text-dim);font-size:13px;">No team assigned</div>`;
        } else if (es && es.placement) {
          resultHTML = `<div style="display:flex;align-items:center;gap:16px;">
            <span class="placement-badge p${es.placement<=3?es.placement:'-other'}" style="width:40px;height:40px;font-size:16px;border-radius:12px;">${es.placement}</span>
            <div>
              <div style="font-size:14px;color:var(--white);font-weight:600;">${es.placement}${['','st','nd','rd'][es.placement]||'th'} Place</div>
              ${es.placement <= 3 && !isTeamEvent ? '<div style="font-size:11px;color:var(--gold-dim);font-weight:600;letter-spacing:0.5px;">' + App.getMedalistTitle(es.placement) + '</div>' : ''}
              <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);">${es.points} points</div>
            </div>
          </div>`;
        } else if (es && es.disqualified) {
          resultHTML = `<span class="dq-tag">Disqualified</span>`;
        } else {
          resultHTML = `<div style="color:var(--text-dim);font-size:14px;">${e.status==='active'?'🟢 Event in progress...':'Awaiting results'}</div>`;
        }

        return `<div class="card" style="padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;${e.status==='active'?'border-color:rgba(52,211,153,0.3);':''}">
          <div class="event-icon" style="width:48px;height:48px;font-size:24px;border-radius:12px;flex-shrink:0;">${e.icon}</div>
          <div style="flex:1;min-width:150px;">
            <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--white);text-transform:uppercase;">${e.name}</div>
            <span class="event-status ${e.status}" style="font-size:10px;padding:2px 8px;"><span class="status-dot"></span> ${App.getStatusLabel(e.status)}</span>
            <span class="event-type-badge ${e.event_type}" style="font-size:9px;margin-left:4px;">${e.event_type}</span>
          </div>
          <div style="min-width:160px;">${resultHTML}</div>
        </div>`;
      }).join('');
    }

    const savedId = API.getCurrentAthleteId();
    if (savedId) showProfile();

    API.onReady(() => { if (API.getCurrentAthleteId()) renderProfile(); });
    API.onChange(() => { if (API.getCurrentAthleteId()) renderProfile(); });
  </script>
</body>
</html>
